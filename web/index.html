<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pão de Queijo Clicker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#F4F7FD; --azul:#1E4FA3; --panel:#FFFFFF; --ink:#18223F; --muted:#56607E;
  --line:#D5DDEE; --plus:#9A5A1E; --glow:#E9B649; --on-azul:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:#0E1730; --azul:#86A9F2; --panel:#141F3D; --ink:#EDF1FF; --muted:#A2ADCC;
    --line:#26355F; --plus:#F2C86A; --glow:#F2C86A; --on-azul:#0E1730; color-scheme:dark;
  }
  :root:not([data-theme="light"]) body{background-image:var(--tile-d)}
}
:root[data-theme="dark"]{
  --wall:#0E1730; --azul:#86A9F2; --panel:#141F3D; --ink:#EDF1FF; --muted:#A2ADCC;
  --line:#26355F; --plus:#F2C86A; --glow:#F2C86A; --on-azul:#0E1730; color-scheme:dark;
}
:root[data-theme="dark"] body{background-image:var(--tile-d)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{background:var(--wall);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background-color:var(--wall); background-image:var(--tile-l);
  font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--ink); -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);height:100%}

/* Palco */
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:24px 16px;overflow:hidden;text-align:center}
.brand{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:400;font-size:1.2rem;color:var(--azul);margin:0}
.bank{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-size:clamp(2.4rem,6vw,4rem);line-height:1;margin:4px 0 0;font-variant-numeric:tabular-nums}
.unit{color:var(--muted);margin:0}
.pps{margin:0;font-weight:600}
.cpc{margin:0;font-size:.85rem;color:var(--muted)}
.buffs{min-height:1.3em;margin:0;font-size:.9rem;color:var(--plus);font-weight:600}
.brand,.bank,.unit,.pps,.cpc,.buffs,.shelf{position:relative;z-index:1}
.paowrap{--pw:clamp(180px,min(32vw,38svh),340px);position:relative;width:var(--pw);aspect-ratio:1;margin:calc(var(--pw)*.1 + 4px) 0;flex:none}
.pao{appearance:none;border:0;background:none;padding:0;cursor:pointer;position:relative;z-index:1;width:100%;aspect-ratio:1;border-radius:50%;touch-action:manipulation;transition:transform .08s ease-out;display:block}
.pao:active{transform:scale(.94)}
.pao:focus-visible{outline:3px solid var(--azul);outline-offset:6px}
.pao svg{width:100%;height:100%;display:block}
.pao.pop svg{animation:pop .22s ease-out}
@keyframes pop{40%{transform:scale(1.06)}}
.float{position:absolute;pointer-events:none;font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-size:1.4rem;color:var(--plus);transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;z-index:2;white-space:nowrap}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.cafe{position:absolute;z-index:3;font-size:2.6rem;line-height:1;background:var(--panel);border:3px solid var(--azul);border-radius:50%;width:64px;height:64px;cursor:pointer;transform:translate(-50%,-50%);animation:bob 1.4s ease-in-out infinite;touch-action:manipulation}
.cafe:focus-visible{outline:3px solid var(--plus);outline-offset:4px}
@keyframes bob{50%{transform:translate(-50%,-62%) rotate(6deg)}}

/* Efeitos do pão */
.fx{position:absolute;pointer-events:none;opacity:0;transition:opacity .8s}
.aura{inset:-32%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 55%,transparent) 0,color-mix(in srgb,var(--glow) 22%,transparent) 38%,transparent 68%);transform:scale(calc(.6 + var(--power,0)*.8));transition:opacity .8s,transform .8s}
.t2 .aura{opacity:calc(.5 + var(--power,0)*.5)}
.boost .aura{opacity:.95;animation:boost 1.2s ease-in-out infinite}
@keyframes boost{50%{transform:scale(calc(.75 + var(--power,0)*.8))}}
.steam{inset:0}
.steam i{position:absolute;top:12%;left:var(--x);width:14%;height:20%;margin-left:-7%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--muted) 45%,transparent),transparent);opacity:0;animation:steam 3.2s ease-out infinite;animation-delay:var(--d)}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}25%{opacity:.7}100%{transform:translateY(-70%) scale(1.5);opacity:0}}
.t1 .steam{opacity:1}
.sparkles{inset:-6%}
.sparkles i{position:absolute;left:var(--x);top:var(--y);font-style:normal;font-size:1rem;line-height:1;color:var(--glow);text-shadow:0 0 6px var(--glow);animation:twinkle 2.4s ease-in-out infinite;animation-delay:var(--d)}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.2}50%{transform:scale(1.1);opacity:1}}
.t3 .sparkles{opacity:1}
.rim{inset:9%;border-radius:50%;box-shadow:0 0 22px 4px color-mix(in srgb,var(--glow) 65%,transparent),inset 0 0 18px 2px color-mix(in srgb,var(--glow) 40%,transparent)}
.t4 .rim{opacity:.85}
.t5 .rim{animation:halo 2.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.6}50%{opacity:1}}
.rays{inset:-30%;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--glow) 40%,transparent) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,transparent 30%,#000 42%,transparent 70%);mask-image:radial-gradient(circle,transparent 30%,#000 42%,transparent 70%);animation:spin 50s linear infinite}
.t5 .rays{opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}

/* Órbita */
.orbit{--r:calc(var(--pw)*.56);--os:1.3rem;position:absolute;inset:0;z-index:1;pointer-events:none;animation:spin 70s linear infinite}
.orb{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateX(var(--r))}
.ic{position:absolute;left:0;top:0;width:1.6em;height:1.6em;margin:-.8em 0 0 -.8em;font-size:var(--os);line-height:1.6em;text-align:center;transform:rotate(calc(-1*var(--a)));animation:unspin 70s linear infinite}
@keyframes unspin{from{transform:rotate(calc(-1*var(--a)))}to{transform:rotate(calc(-1*var(--a) - 360deg))}}
.ic span{display:block}

/* Vitrine */
.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;max-width:min(100%,640px);padding:8px 12px 10px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:2px solid var(--line);border-bottom:6px solid var(--plus);border-radius:12px 12px 6px 6px}
.shelf[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;background:var(--wall);border:2px solid var(--line);border-radius:999px;padding:1px 10px 1px 6px;font-weight:600}
.ci{font-size:1.2rem;line-height:1.4}
.cn{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;color:var(--azul);font-variant-numeric:tabular-nums}
.fly,.crumb{position:fixed;left:0;top:0;pointer-events:none;z-index:9}
.fly{width:2.2rem;height:2.2rem;margin:-1.1rem 0 0 -1.1rem;font-size:1.8rem;line-height:2.2rem;text-align:center}
.crumb{width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FCE3A0,#E9B649 60%,#B9772A)}

/* Loja */
.store{background:var(--panel);border-left:4px solid var(--azul);overflow-y:auto;padding:20px 16px 32px;-webkit-overflow-scrolling:touch}
.store h2{font-size:1rem;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--wall);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:border-color .12s}
.item:hover:not(.poor){border-color:var(--azul)}
.item:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.item.poor{opacity:.5;cursor:not-allowed}
.item.shake{animation:shake .25s}
.item[hidden]{display:none}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ico{font-size:1.8rem;width:2.2rem;text-align:center;flex:none}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:600}
.ds{font-size:.85rem;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted);margin-top:2px}
.cost{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.cost::before{content:"";width:.75em;height:.75em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FCE3A0,#E9B649 60%,#B9772A)}
.own{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-size:1.8rem;color:var(--azul);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--azul);color:var(--on-azul)}
.seg button:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
.stats{font-size:.85rem;color:var(--muted);line-height:1.6;border-top:2px solid var(--line);padding-top:14px;margin-bottom:24px}
.stats p{margin:0}
.save-status{min-height:1.6em;margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.actions{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.btn{background:none;border:2px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.reset.armed{border-color:#C0392B;color:#C0392B}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--azul);color:var(--on-azul);padding:10px 16px;border-radius:12px;font-weight:600;max-width:min(92vw,440px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .stage{padding:10px 16px 12px;gap:4px}
  .brand{font-size:1rem}
  .bank{font-size:2.2rem}
  .paowrap{--pw:min(38vw,26svh);margin:calc(var(--pw)*.06) 0}
  .orbit{--r:calc(var(--pw)*.52);--os:.85rem}
  .shelf{padding:2px 6px 3px;gap:6px;border-width:1px;border-bottom-width:4px;border-radius:10px 10px 4px 4px}
  .chip{padding:0 8px 0 4px;gap:4px;border-width:1px}
  .ci{font-size:1rem;line-height:1.3}
  .cn{font-size:.9rem}
  .shelf{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;width:100%;max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .shelf::-webkit-scrollbar{display:none}
  .chip:first-child{margin-left:auto}
  .chip:last-child{margin-right:auto}
  .store{border-left:0;border-top:4px solid var(--azul);padding-top:16px}
}
@media (max-height:500px){
  .stage{padding:8px 16px;gap:4px}
  .paowrap{--pw:clamp(110px,min(32vw,34svh),340px);margin:calc(var(--pw)*.08) 0}
  .shelf{display:none}
}
@media (max-width:760px) and (max-height:500px){
  .paowrap{--pw:min(40vw,26svh);margin:0}
  .orbit{--r:calc(var(--pw)*.5);--os:.8rem}
}
@media (prefers-reduced-motion:reduce){
  .float{animation:fade .9s forwards}
  @keyframes fade{to{opacity:0}}
  .cafe,.pao.pop svg,.item.shake{animation:none}
  .pao{transition:none}
  .orbit,.ic,.rays,.steam i,.sparkles i,.t5 .rim,.boost .aura{animation:none}
  .steam{display:none}
  .fx{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <h1 class="brand">Pão de Queijo Clicker</h1>
    <p class="bank" id="bank">0</p>
    <p class="unit" id="unit">pães de queijo</p>
    <p class="pps" id="pps">0 por segundo</p>
    <p class="cpc" id="cpc">1 por clique</p>
    <p class="buffs" id="buffs" aria-live="polite"></p>
    <div class="paowrap" id="paowrap">
    <div class="fx aura" aria-hidden="true"></div>
    <div class="fx rays" aria-hidden="true"></div>
    <div class="fx rim" aria-hidden="true"></div>
    <div class="fx steam" aria-hidden="true"><i style="--x:36%;--d:0s"></i><i style="--x:50%;--d:1.1s"></i><i style="--x:64%;--d:2.1s"></i></div>
    <div class="fx sparkles" aria-hidden="true"><i style="--x:6%;--y:30%;--d:0s">✦</i><i style="--x:90%;--y:26%;--d:.6s">✦</i><i style="--x:10%;--y:80%;--d:1.2s">✦</i><i style="--x:88%;--y:74%;--d:1.8s">✦</i><i style="--x:50%;--y:0%;--d:.9s">✦</i></div>
    <button class="pao" id="pao" aria-label="Fazer um pão de queijo">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <radialGradient id="dough" cx="40%" cy="34%" r="72%">
            <stop offset="0" stop-color="#FDE7AE"/>
            <stop offset=".5" stop-color="#EDBB52"/>
            <stop offset="1" stop-color="#B26E25"/>
          </radialGradient>
          <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
            <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="9"/>
            <feDisplacementMap in="SourceGraphic" scale="12"/>
          </filter>
        </defs>
        <ellipse cx="100" cy="182" rx="66" ry="9" fill="rgba(0,0,0,.18)"/>
        <g filter="url(#rough)">
          <ellipse cx="100" cy="100" rx="80" ry="76" fill="url(#dough)"/>
          <path d="M58 70 q18 -10 34 2 q12 9 28 -2" fill="none" stroke="#A8641F" stroke-width="3" stroke-linecap="round" opacity=".55"/>
          <path d="M70 128 q20 10 40 0" fill="none" stroke="#A8641F" stroke-width="3" stroke-linecap="round" opacity=".45"/>
          <path d="M128 92 q10 14 4 30" fill="none" stroke="#A8641F" stroke-width="3" stroke-linecap="round" opacity=".45"/>
        </g>
        <g fill="#FFF3CC" opacity=".75">
          <ellipse cx="74" cy="92" rx="9" ry="5"/>
          <ellipse cx="112" cy="70" rx="6" ry="4"/>
          <ellipse cx="96" cy="112" rx="7" ry="4"/>
          <ellipse cx="138" cy="120" rx="5" ry="3"/>
          <ellipse cx="60" cy="118" rx="4" ry="3"/>
        </g>
      </svg>
    </button>
    <div class="orbit" id="orbit" aria-hidden="true"></div>
    </div>
    <div class="shelf" id="shelf" role="list" aria-label="Vitrine da fornada" hidden></div>
  </main>

  <aside class="store" aria-label="Loja">
    <h2>Melhorias</h2>
    <div class="list" id="ups"></div>

    <h2>Produção
      <span class="seg" role="group" aria-label="Quantidade por compra">
        <button data-n="1">×1</button><button data-n="10">×10</button><button data-n="100">×100</button>
      </span>
    </h2>
    <div class="list" id="blds"></div>

    <div class="stats">
      <p id="statTotal"></p>
      <p id="statClicks"></p>
    </div>

    <h2>Ajustes</h2>
    <p class="save-status" id="saveStatus"></p>
    <div class="actions">
      <button class="btn" id="saveNow">Salvar agora</button>
      <button class="btn reset" id="reset">Recomeçar do zero</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import init, { Client, catalog_json, schema_version } from '__GLUE__';

// Fundo de azulejo
const tile = c => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='88' height='88' viewBox='0 0 88 88'><g fill='none' stroke='${c}' stroke-width='2'><rect x='1' y='1' width='86' height='86'/><path d='M44 14C52 28 60 36 74 44C60 52 52 60 44 74C36 60 28 52 14 44C28 36 36 28 44 14Z'/><circle cx='44' cy='44' r='7'/><path d='M0 18Q14 14 18 0M88 18Q74 14 70 0M0 70Q14 74 18 88M88 70Q74 74 70 88'/></g></svg>`)}")`;
document.documentElement.style.setProperty('--tile-l', tile('rgba(30,79,163,.13)'));
document.documentElement.style.setProperty('--tile-d', tile('rgba(134,169,242,.08)'));

const SAVE_KEY = 'pdq-clicker-v1';

// Números
const BIG = [[1e21,'sextilhão','sextilhões'],[1e18,'quintilhão','quintilhões'],[1e15,'quatrilhão','quatrilhões'],
             [1e12,'trilhão','trilhões'],[1e9,'bilhão','bilhões'],[1e6,'milhão','milhões']];
const nfCache = {};
function nf(minDec, maxDec){
  const k = minDec + ',' + maxDec;
  return nfCache[k] ??= new Intl.NumberFormat('pt-BR', {minimumFractionDigits:minDec, maximumFractionDigits:maxDec});
}
function fmt(n, dec=0){
  if(!isFinite(n)) return '∞';
  if(n >= 1e24) return n.toExponential(2).replace('.',',');
  for(const [v,s,p] of BIG){
    if(n >= v){
      const x = n/v;
      return nf(x<100?2:0, x<100?2:0).format(x) + ' ' + (x<2?s:p);
    }
  }
  return nf(0, n<1000 ? dec : 0).format(n);
}

// Servidor
const OFFLINE_MSG = 'Sem conexão com o servidor. O progresso fica salvo neste aparelho.';
const sleep = ms => new Promise(r => setTimeout(r, ms));
// version é null até um GET dar certo; sem version não há PUT.
let version = null, acked = null, inflight = false, epoch = 0;
// Versão do servidor em que o espelho carregado no boot se baseava.
let bootV = null, lastMirrored = null;
// JSONs enviados recentemente (normalizado -> original), para reconhecer o próprio PUT num 409.
const sent = new Map();
let outage = false, failures = 0, syncing = false, schemaWarned = false;
let savedText = '', saving = false, otherTab = 0;

// Espelho local: o jogo continua e não perde progresso com a API fora do ar.
// v: versão do servidor em que este estado se baseia. Uma aba parada não reescreve o espelho.
function baseV(){ return version ?? bootV; }
function mirror(){
  const json = client.to_json(), key = json + '|' + baseV();
  if(key === lastMirrored) return;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({...JSON.parse(json), t:Date.now(), v:baseV()}));
    lastMirrored = key;
  }catch(e){}
}
function hasMirror(){ try{ return localStorage.getItem(SAVE_KEY) !== null; }catch(e){ return false; } }
function failed(){
  if(++failures >= 3 && !outage){ outage = true; toast(OFFLINE_MSG); }
}
function adopt(state, v){
  client.load(JSON.stringify(state));
  version = v; acked = client.to_json(); sent.clear(); upKey = null; renderSeg();
}
const stamp = () => { savedText = 'Salvo às ' + new Date().toLocaleTimeString('pt-BR'); };
const norm = json => JSON.stringify(JSON.parse(json));

async function pushSave(keepalive){
  const json = client.to_json();
  if(version === null || (inflight && !keepalive) || json === acked) return 'skip';
  const myEpoch = epoch;
  if(!keepalive) inflight = true;
  sent.set(norm(json), json);
  if(sent.size > 5) sent.delete(sent.keys().next().value);
  let after = null;
  try{
    const res = await fetch('/api/save', {method:'PUT', headers:{'content-type':'application/json'},
      body:`{"state":${json},"version":${version},"schema_version":${schema_version()}}`, keepalive,
      signal: keepalive ? undefined : AbortSignal.timeout?.(10000)});
    if(myEpoch !== epoch) return 'stale';
    if(res.status === 200){
      const b = await res.json();
      failures = 0; outage = false;
      stamp();
      if(b.clamped) adopt(b.state, b.version); else { version = b.version; acked = json; }
      return 'ok';
    }
    if(res.status === 409){
      const b = await res.json();
      if(!b.state){ after = sync; return 'conflict'; }
      const mine = sent.get(JSON.stringify(b.state));
      if(mine !== undefined && (b.version === version || b.version === version + 1)){
        if(b.version > version){ stamp(); version = b.version; acked = mine; }
      }else { adopt(b.state, b.version); otherTab++; toast('Progresso atualizado por outra aba.'); }
      return 'conflict';
    }
    if(res.status === 429) return 'limited';
    if(res.status === 401){ after = sync; return 'retry'; }
    if(res.status === 400 && (await res.json().catch(() => ({}))).error === 'unsupported schema'){
      if(!schemaWarned){ schemaWarned = true; toast('Nova versão do jogo disponível. Recarregue a página.'); }
      return 'schema';
    }
    failed();
  }catch(e){ failed(); }
  finally{ if(!keepalive) inflight = false; if(after) setTimeout(after, 0); }
  return 'retry';
}

// Primeira sincronização e reconexão: GET com espera crescente (5 s até 60 s).
async function sync(){
  if(syncing) return;
  syncing = true;
  try{
    let delay = 5000, s;
    const epoch0 = epoch, version0 = version;
    for(;;){
      try{ const res = await fetch('/api/save'); if(!res.ok) throw new Error(res.status); s = await res.json(); break; }
      catch(e){
        if(!outage){ outage = true; toast(OFFLINE_MSG); }
        await sleep(delay); delay = Math.min(delay * 2, 60000);
      }
    }
    outage = false; failures = 0;
    // Um reset ou um save terminou enquanto o GET voava: o resultado está velho.
    if(epoch !== epoch0 || version !== version0) return;
    if(s.state === null){
      version = 0; acked = null;
      if(hasMirror()) await importMirror();
    }else if(baseV() === s.version && client.total() > s.state.total){
      version = s.version; acked = null;
      await pushSave(false);
    }else{
      adopt(s.state, s.version);
      if(s.offline > 0) setTimeout(()=>toast(`Enquanto você estava fora, a turma fez ${fmt(s.offline)} pães de queijo.`), 400);
    }
  }finally{ syncing = false; }
}
// Sem linha no servidor: envia o jogo local como versão 0. Desiste após 3 tentativas e mantém o espelho.
async function importMirror(){
  for(let i = 0; i < 3; i++){
    const r = await pushSave(false);
    if(r === 'ok' || r === 'conflict' || r === 'skip' || r === 'limited') return;
    if(r === 'schema') break;
    await sleep(5000);
  }
  if(version === 0) version = null;
}
function saveTick(keepalive){ mirror(); pushSave(keepalive); }

// Salvar agora: mesmo pushSave. true = salvo, false = falhou, null = reset no meio (silencioso).
async function saveNow(){
  if(version === null && outage) return false;
  for(let w = 0; (inflight || (version === null && syncing)) && w < 150; w++) await sleep(100);
  mirror();
  for(let tries = 0; tries < 4;){
    if(version === null) return false;
    if(client.to_json() === acked){ if(!savedText) stamp(); return true; }
    const v0 = version, r = await pushSave(false);
    if(r === 'skip'){ await sleep(100); continue; }
    tries++;
    if(r === 'ok') return true;
    if(r === 'stale') return null;
    if(r === 'limited'){ if(tries < 4) await sleep(5250); }
    else if(r !== 'conflict' || version === v0) return false;
  }
  return false;
}

// DOM
const $ = id => document.getElementById(id);
const stage=$('stage'), pao=$('pao'), paoWrap=$('paowrap'), orbitEl=$('orbit'), shelfEl=$('shelf'), upsEl=$('ups'), bldsEl=$('blds'), toastEl=$('toast');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function setText(el, t){ if(el._t !== t){ el.textContent = t; el._t = t; } }
function setAttr(el, name, v){ v = String(v); if(el._a?.[name] !== v){ el.setAttribute(name, v); (el._a ??= {})[name] = v; } }
function setClass(el, name, on){ if(el._c?.[name] !== on){ el.classList.toggle(name, on); (el._c ??= {})[name] = on; } }
function setHidden(el, h){ if(el._h !== h){ el.hidden = h; el._h = h; } }

let toastTimer;
function toast(msg){
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 4200);
}
try{ await init({ module_or_path: '__WASM__' }); }
catch(e){ console.error(e); toast('Não foi possível carregar o jogo. Recarregue a página.'); throw e; }
const client = new Client();
const { buildings: B, upgrades: UPGRADES } = JSON.parse(catalog_json());

// Mirrors the CSS keyframes pop and shake; each key carries its own easing like animation-timing-function.
function shake(el){
  if(reduceMotion.matches) return;
  el.animate([
    {transform:'translateX(0)', easing:'ease'},
    {transform:'translateX(-4px)', offset:.25, easing:'ease'},
    {transform:'translateX(4px)', offset:.75, easing:'ease'},
    {transform:'translateX(0)'},
  ], {duration:250});
}
function pop(el){
  if(reduceMotion.matches) return;
  el.animate([
    {transform:'scale(1)', easing:'ease-out'},
    {transform:'scale(1.06)', offset:.4, easing:'ease-out'},
    {transform:'scale(1)'},
  ], {duration:220});
}

// Efeitos de compra: ícone voa da loja até o pão, migalhas e pulo na vitrine
let flyers = 0, crumbs = 0;
function flightRects(el){
  if(reduceMotion.matches || flyers >= 6) return null;
  return [el.getBoundingClientRect(), paoWrap.getBoundingClientRect()];
}
function fly(icon, rects, onArrive){
  if(!rects) return;
  const [a, b] = rects;
  const sx = a.left + a.width/2, sy = a.top + a.height/2, tx = b.left + b.width/2, ty = b.top + b.height/2;
  const el = document.createElement('span');
  el.className = 'fly'; el.textContent = icon; el.setAttribute('aria-hidden', 'true');
  document.body.appendChild(el);
  flyers++;
  const anim = el.animate([
    {transform:`translate(${sx}px,${sy}px) scale(1)`, opacity:1, easing:'ease-out'},
    {transform:`translate(${(sx+tx)/2}px,${(sy+ty)/2 - 60}px) scale(1.3)`, opacity:1, offset:.45, easing:'ease-in'},
    {transform:`translate(${tx}px,${ty}px) scale(.45)`, opacity:.3},
  ], {duration:600, fill:'backwards'});
  const done = ok => { el.remove(); flyers--; if(ok){ burst(tx, ty); onArrive(); } };
  anim.onfinish = () => done(true);
  anim.oncancel = () => done(false);
}
function burst(x, y){
  if(crumbs + 8 > 30) return;
  const n = 6 + Math.floor(Math.random()*3);
  for(let k = 0; k < n; k++){
    const el = document.createElement('span');
    el.className = 'crumb';
    document.body.appendChild(el);
    crumbs++;
    const ang = Math.random()*Math.PI*2, d = 30 + Math.random()*30;
    const dx = Math.cos(ang)*d, dy = Math.sin(ang)*d;
    const anim = el.animate([
      {transform:`translate(${x}px,${y}px) scale(1)`, opacity:1, easing:'ease-out'},
      {transform:`translate(${x + dx}px,${y + dy + 18}px) scale(.3)`, opacity:0},
    ], {duration:450});
    anim.onfinish = anim.oncancel = () => { el.remove(); crumbs--; };
  }
}
function popIn(el){
  if(reduceMotion.matches) return;
  el.animate([{transform:'scale(0)', easing:'ease-out'}, {transform:'scale(1.4)', offset:.6, easing:'ease-in-out'}, {transform:'scale(1)'}], {duration:450});
}
function bump(el){
  if(reduceMotion.matches) return;
  el.animate([
    {transform:'scale(1)', easing:'ease-out'},
    {transform:'scale(1.3)', offset:.4, easing:'ease-in-out'},
    {transform:'scale(1)'},
  ], {duration:320});
}

// Clique no pão
let floats = 0;
const floatQueue = [];
const paoSvg = pao.querySelector('svg');
pao.addEventListener('click', e => {
  const v = client.click();
  pop(paoSvg);
  if(floats + floatQueue.length > 40) return;
  floatQueue.push({x:e.clientX, y:e.clientY, keyboard:!e.detail || (!e.clientX && !e.clientY), text:'+' + fmt(v, v<10?1:0)});
});
function flushFloats(){
  const r = stage.getBoundingClientRect();
  const p = floatQueue.some(q => q.keyboard) ? pao.getBoundingClientRect() : null;
  for(const q of floatQueue){
    let {x, y} = q;
    if(q.keyboard){ x = p.left+p.width/2; y = p.top+p.height/3; }
    const f = document.createElement('span');
    f.className = 'float';
    f.textContent = q.text;
    f.style.left = (x - r.left + (Math.random()*20-10)) + 'px';
    f.style.top = (y - r.top) + 'px';
    floats++;
    f.addEventListener('animationend', ()=>{ f.remove(); floats--; });
    stage.appendChild(f);
  }
  floatQueue.length = 0;
}

// Prédios
const bItems = B.map((b, i) => {
  const btn = document.createElement('button');
  btn.className = 'item';
  btn.innerHTML = `<span class="ico" aria-hidden="true"></span><span class="info"><span class="nm"></span><span class="ds"></span><span class="meta"><span class="cost"></span><span class="rate"></span></span></span><span class="own"></span>`;
  const it = {el:btn, ico:btn.querySelector('.ico'), nm:btn.querySelector('.nm'), ds:btn.querySelector('.ds'),
    cost:btn.querySelector('.cost'), rate:btn.querySelector('.rate'), own:btn.querySelector('.own'), locked:false};
  btn.addEventListener('click', () => {
    const rects = flightRects(it.ico);
    if(it.locked || !client.buy_building(i)){ shake(btn); return; }
    fly(b.icon, rects, () => { if(chips[i]) bump(chips[i].el); });
  });
  bldsEl.appendChild(btn);
  return it;
});

function renderBuildings(){
  let lockedShown = false;
  B.forEach((b, i) => {
    const it = bItems[i];
    const revealed = client.revealed(i);
    let visible = revealed, locked = false;
    if(!revealed && !lockedShown){ visible = true; locked = true; lockedShown = true; }
    setHidden(it.el, !visible);
    if(!visible) return;
    it.locked = locked;
    setClass(it.el, 'locked', locked);
    const own = client.owned(i);
    setText(it.ico, locked ? '❔' : b.icon);
    setText(it.nm, locked ? '???' : b.name);
    setText(it.ds, locked ? 'Faça mais pães de queijo para descobrir.' : b.desc);
    const c = client.cost(i);
    setText(it.cost, fmt(c));
    setText(it.rate, locked ? '' : `${fmt(client.building_rate(i),1)}/s cada`);
    setText(it.own, own ? fmt(own) : '');
    const poor = locked || client.bank() < c;
    setClass(it.el, 'poor', poor);
    setAttr(it.el, 'aria-disabled', poor);
    setAttr(it.el, 'aria-label', locked ? `Produção ainda não descoberta, custa ${fmt(c)}` : `${b.name}, tem ${own}, comprar ${client.buy()} por ${fmt(c)}`);
  });
}

// Melhorias
let upKey = null, upItems = [];
function renderUpgrades(){
  const avail = client.available_upgrades();
  const key = avail.join();
  if(key !== upKey){
    upKey = key; upsEl.innerHTML = ''; upItems = [];
    if(!avail.length){
      const p = document.createElement('p'); p.className='empty';
      p.textContent = 'Continue fazendo pães de queijo para liberar melhorias.';
      upsEl.appendChild(p);
    }
    for(const i of avail){
      const u = UPGRADES[i];
      const btn = document.createElement('button');
      btn.className = 'item';
      btn.innerHTML = `<span class="ico" aria-hidden="true">${u.icon}</span><span class="info"><span class="nm"></span><span class="ds"></span><span class="meta"><span class="cost"></span></span></span>`;
      btn.querySelector('.nm').textContent = u.name;
      btn.querySelector('.ds').textContent = u.desc;
      btn.querySelector('.cost').textContent = fmt(u.cost);
      btn.addEventListener('click', () => {
        const rects = flightRects(btn.firstElementChild);
        if(!client.buy_upgrade(i)){ shake(btn); return; }
        fly(u.icon, rects, () => pop(paoSvg));
        upKey = null;
        toast(`Comprado: ${u.name}`);
      });
      upsEl.appendChild(btn);
      upItems.push([u, btn]);
    }
  }
  const bank = client.bank();
  for(const [u, btn] of upItems){
    const poor = bank < u.cost;
    setClass(btn, 'poor', poor);
    setAttr(btn, 'aria-disabled', poor);
  }
}

// Pão: tiers por produção base, vitrine e órbita
const TIERS = [1, 1e2, 1e4, 1e6, 1e9];
const owns = new Array(B.length).fill(0), chips = new Array(B.length).fill(null);
const orbitCounts = new Array(B.length).fill(0), orbitMq = matchMedia('(max-width:760px)');
let orbitKey = '';
function setVar(el, name, v){ if(el._v?.[name] !== v){ el.style.setProperty(name, v); (el._v ??= {})[name] = v; } }
function renderPaoFx(boost){
  const base = client.base_pps();
  let tier = 0;
  while(tier < TIERS.length && base >= TIERS[tier]) tier++;
  for(let n = 1; n <= TIERS.length; n++) setClass(paoWrap, 't' + n, tier >= n);
  setClass(paoWrap, 'boost', boost);
  setVar(paoWrap, '--power', Math.round(Math.min(1, Math.max(0, Math.log10(Math.max(base, 1))/12))*20)/20);
}
function renderShelf(){
  let any = false;
  B.forEach((b, i) => {
    const n = owns[i];
    if(n && !chips[i]){
      const el = document.createElement('span');
      el.className = 'chip'; el.setAttribute('role', 'listitem');
      el.innerHTML = '<span class="ci" aria-hidden="true"></span><span class="cn"></span>';
      el.firstChild.textContent = b.icon;
      let next = null;
      for(let j = i + 1; j < B.length && !next; j++) next = chips[j]?.el ?? null;
      shelfEl.insertBefore(el, next);
      chips[i] = {el, cn:el.lastChild};
    }else if(!n && chips[i]){ chips[i].el.remove(); chips[i] = null; }
    if(chips[i]){ any = true; setText(chips[i].cn, fmt(n)); setAttr(chips[i].el, 'aria-label', `${b.name}: ${n}`); }
  });
  setHidden(shelfEl, !any);
}
function renderOrbit(){
  const perType = orbitMq.matches ? 3 : 4, cap = orbitMq.matches ? 12 : 24;
  const counts = owns.map(n => n ? Math.min(perType, 1 + Math.floor(Math.log2(n))) : 0);
  let sum = counts.reduce((a, c) => a + c, 0);
  while(sum > cap){ counts[counts.lastIndexOf(Math.max(...counts))]--; sum--; }
  const key = counts.join();
  if(key === orbitKey) return;
  orbitKey = key;
  const fresh = new Set(), list = [];
  for(let k = 0; k < perType; k++) counts.forEach((c, i) => { if(c > k){ list.push(i); if(k >= orbitCounts[i]) fresh.add(list.length - 1); } });
  orbitCounts.splice(0, orbitCounts.length, ...counts);
  const orbitAnim = orbitEl.getAnimations()[0];
  const delay = orbitAnim ? -orbitAnim.currentTime + 'ms' : '0ms';
  orbitEl.textContent = '';
  list.forEach((t, k) => {
    const orb = document.createElement('div'), ic = document.createElement('div'), sp = document.createElement('span');
    orb.className = 'orb'; ic.className = 'ic';
    orb.style.setProperty('--a', (-90 + 360*k/list.length) + 'deg');
    ic.style.animationDelay = delay;
    sp.textContent = B[t].icon;
    ic.appendChild(sp); orb.appendChild(ic); orbitEl.appendChild(orb);
    if(fresh.has(k)) popIn(sp);
  });
}
function renderStage(boost){
  let changed = false;
  for(let i = 0; i < B.length; i++){
    const n = client.owned(i);
    if(n !== owns[i]){ owns[i] = n; changed = true; }
  }
  if(changed) renderShelf();
  if(changed || orbitMq.matches !== orbitMobile){ orbitMobile = orbitMq.matches; renderOrbit(); }
  renderPaoFx(boost);
}
let orbitMobile = orbitMq.matches;

// Quantidade por compra
const segBtns = document.querySelectorAll('.seg button');
function renderSeg(){ segBtns.forEach(b => setAttr(b, 'aria-pressed', +b.dataset.n === client.buy())); }
segBtns.forEach(b => b.addEventListener('click', () => { client.set_buy(+b.dataset.n); renderSeg(); }));

// Cafezinho bônus
let cafeEl = null, cafeUntil = 0, nextCafe = performance.now() + (30 + Math.random()*30)*1000;
function spawnCafe(now){
  cafeEl = document.createElement('button');
  cafeEl.className = 'cafe';
  cafeEl.textContent = '☕';
  cafeEl.setAttribute('aria-label', 'Cafezinho: toque para ganhar um bônus');
  cafeEl.style.left = (12 + Math.random()*76) + '%';
  cafeEl.style.top = (18 + Math.random()*68) + '%';
  cafeEl.addEventListener('click', () => {
    const [kind, amount] = client.cafe(Math.random(), performance.now());
    if(kind === 0) toast('Café extraforte! Cliques ×77 por 13 segundos.');
    else if(kind === 1) toast('Cafezinho passado na hora! Produção ×7 por 30 segundos.');
    else toast(`Café com prosa: +${fmt(amount)} pães de queijo.`);
    removeCafe();
  });
  stage.appendChild(cafeEl);
  cafeUntil = now + 13000;
}
function removeCafe(){
  if(cafeEl){ cafeEl.remove(); cafeEl = null; }
  nextCafe = performance.now() + (60 + Math.random()*90)*1000;
}

// Salvar agora
const saveBtn = $('saveNow');
saveBtn.addEventListener('click', async () => {
  if(saving) return;
  saveBtn.setAttribute('aria-disabled', 'true'); saving = true;
  const other0 = otherTab, ok = await saveNow();
  saving = false; saveBtn.removeAttribute('aria-disabled');
  if(ok === null || (ok && otherTab !== other0)) return;
  toast(ok ? 'Progresso salvo.' : 'Não foi possível salvar agora. O progresso fica salvo neste aparelho.');
});

// Reset
const resetBtn = $('reset'); let resetTimer;
resetBtn.addEventListener('click', async () => {
  if(!resetBtn.classList.contains('armed')){
    resetBtn.classList.add('armed'); resetBtn.textContent = 'Toque de novo para apagar tudo';
    resetTimer = setTimeout(()=>{ resetBtn.classList.remove('armed'); resetBtn.textContent = 'Recomeçar do zero'; }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  resetBtn.classList.remove('armed'); resetBtn.textContent = 'Recomeçar do zero';
  epoch++;
  try{
    const res = await fetch('/api/reset', {method:'POST', headers:{'content-type':'application/json'}, body:'{}'});
    if(!res.ok) throw new Error(res.status);
    const b = await res.json();
    client.reset();
    adopt(b.state, b.version);
  }catch(e){ toast('Não foi possível apagar agora. Tente de novo.'); return; }
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  lastMirrored = null; savedText = '';
  toast('Tudo apagado. A massa está pronta de novo.');
});

// Render principal
const bankEl=$('bank'), unitEl=$('unit'), ppsEl=$('pps'), cpcEl=$('cpc'), buffsEl=$('buffs'), statTotal=$('statTotal'), statClicks=$('statClicks'), saveStatus=$('saveStatus');
let lastTitle = 0;
function buffText(now){
  const f = client.buffs(), parts = [];
  for(let i = 0; i < f.length; i += 3)
    parts.push(`${f[i]===0?'Produção':'Cliques'} ×${f[i+1]} por mais ${Math.ceil((f[i+2]-now)/1000)}s`);
  return parts.join('  ');
}
function render(now){
  if(floatQueue.length) flushFloats();
  const b = Math.floor(client.bank());
  setText(bankEl, fmt(b));
  setText(unitEl, b === 1 ? 'pão de queijo' : 'pães de queijo');
  setText(ppsEl, `${fmt(client.pps(),1)} por segundo`);
  setText(cpcEl, `${fmt(client.click_value(),1)} por clique`);
  const buffs = buffText(now);
  setText(buffsEl, buffs);
  renderStage(buffs !== '');
  setText(statTotal, `Pães de queijo feitos no total: ${fmt(Math.floor(client.total()))}`);
  setText(statClicks, `Cliques no pão de queijo: ${fmt(client.clicks())}`);
  setText(saveStatus, saving ? 'Salvando...' : outage ? 'Sem conexão: salvo só neste aparelho' : savedText);
  renderUpgrades();
  renderBuildings();
  if(now - lastTitle > 1000){ document.title = `${fmt(b)} pães de queijo · Pão de Queijo Clicker`; lastTitle = now; }
}

// Loop
let last = 0;
function frame(now){
  const dt = Math.max(0, (now - last)/1000); last = now;
  client.tick(dt, now);
  if(!cafeEl && now >= nextCafe) spawnCafe(now);
  if(cafeEl && now >= cafeUntil) removeCafe();
  render(now);
  requestAnimationFrame(frame);
}

// Início: o jogo começa na hora com o espelho local; a API sincroniza em segundo plano.
let raw = null;
try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
if(raw){
  try{ client.load(raw); bootV = JSON.parse(raw).v ?? null; }
  catch(e){ try{ localStorage.setItem(SAVE_KEY + '.bak', raw); }catch(_){} }
}
renderSeg();
setInterval(() => saveTick(false), 30000);
document.addEventListener('visibilitychange', () => { if(document.hidden) saveTick(true); });
addEventListener('pagehide', () => saveTick(true));
addEventListener('pageshow', e => { if(e.persisted) sync(); });
last = performance.now();
nextCafe = last + (30 + Math.random()*30)*1000;
requestAnimationFrame(frame);
sync();
</script>
