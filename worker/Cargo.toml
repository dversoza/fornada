[package]
name = "api"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
game-core = { path = "../game-core" }
worker = { version = "0.8.7", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
js-sys = "0.3"
